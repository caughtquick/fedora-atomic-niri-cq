---
# image will be published to ghcr.io/<user>/<name>
name: fedora-atomic-niri-cq
# description will be included in the image's metadata
description: This is my personal OS image, it is not meant for use by anyone else (you're free to try if you like)

# the base image to build on top of (FROM) and the version tag to use
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 45 # newest stable Fedora; "latest" or "rawhide" are also supported

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - git
        - niri
        - terra-release
        - distrobox
        - NetworkManager-tui
        - chezmoi
        - swaylock
        - swayidle
        - papirus-icon-theme
        - jetbrains-mono-fonts
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - sddm
        - adw-gtk3-theme
        - fuse
        - libvirt
        - gnome-keyring
        - libvirt-daemon-driver-secret
    remove:
      packages:
        - firefox
        - sway
        - pavucontrol
        - wofi
        # Unused since cqicshell: bar + notifications are built in, wallpapers dropped
        - waybar
        - dunst
        - swaybg

  - type: dnf
    install:
      packages:
        - ghostty
        - nwg-look
        - terra-release-multimedia
        - awww
  # aptX/aptX HD Bluetooth codecs (PipeWire's aptX plugin ships in RPM Fusion)
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - libfreeaptx
        - pipewire-codec-aptx

  # Fabric runtime dependencies
  - type: dnf
    install:
      packages:
        # Wayland Layer Shell & System Tray typelib
        - gtk-layer-shell
        - libdbusmenu-gtk3
        # Python dependencies
        - python3-pip
        - python3-setuptools
        - python3-gobject
        - python3-cairo
        - python3-loguru
        - python3-click
        - python3-psutil
        - python3-tomlkit

  # Global install of Fabric into system Python (/usr)
  - type: script
    snippets:
      - pip install --no-deps --break-system-packages --prefix=/usr git+https://github.com/Fabric-Development/fabric.git

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
