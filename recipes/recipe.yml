---
# image will be published to ghcr.io/<user>/<name>
name: fedora-atomic-niri-cq
# description will be included in the image's metadata
description: This is my personal OS image, it is not meant for use by anyone else (you're free to try if you like)

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # Universal Blue stable release; "44" or "beta" (Fedora 45) are also supported

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
    install:
      packages:
        - git
        - niri
        - terra-release
        - distrobox
        - NetworkManager-tui
        - chezmoi
        - swaylock
        - swayidle
        - papirus-icon-theme
        - jetbrains-mono-fonts
        - xdg-desktop-portal-gnome
        - xdg-desktop-portal-gtk
        - polkit-gnome
        - playerctl
        - brightnessctl
        - grim
        - slurp
        - sddm
        # Keep SDDM installed as a fallback; greetd is the active login manager.
        - greetd
        - adw-gtk3-theme
        - fuse
        - libvirt
        - gnome-keyring
        - libvirt-daemon-driver-secret

  - type: dnf
    install:
      packages:
        - ghostty
        - nwg-look
        - terra-release-multimedia
        - awww
        # Noctalia login greeter for greetd (Terra package)
        - noctalia-greeter

  # Fingerprint reader support (libfprint drivers, fprintd daemon, PAM module)
  - type: dnf
    install:
      packages:
        - libfprint
        - fprintd
        - fprintd-pam

  # Allow fingerprint auth for sudo/TTY logins (system-auth) and SDDM.
  # authselect writes pam_fprintd.so into the distro PAM stack with a password
  # fallback, instead of us overriding PAM files wholesale.
  - type: script
    snippets:
      - |
        if command -v authselect >/dev/null 2>&1; then
          if authselect current | grep -q 'with-fingerprint'; then
            echo "authselect: with-fingerprint already enabled"
          else
            authselect enable-feature with-fingerprint
          fi
        else
          echo "authselect not available, skipping with-fingerprint"
        fi

        # SDDM's PAM config uses password-auth, which authselect's feature
        # does not touch, so add fingerprint auth there explicitly.
        if [ -f /etc/pam.d/sddm ] && ! grep -q pam_fprintd /etc/pam.d/sddm; then
          sed -i '1i auth        sufficient    pam_fprintd.so' /etc/pam.d/sddm
        fi

  # aptX/aptX HD Bluetooth codecs (PipeWire's aptX plugin ships in RPM Fusion)
  - type: dnf
    repos:
      nonfree: rpmfusion
    install:
      packages:
        - libfreeaptx
        - pipewire-codec-aptx

  # Fabric runtime dependencies
  - type: dnf
    install:
      packages:
        # Wayland Layer Shell, Session Lock & System Tray typelib
        - gtk-layer-shell
        - gtk-session-lock
        - libdbusmenu-gtk3
        - gobject-introspection
        # Python dependencies
        - python3-pip
        - python3-setuptools
        - python3-gobject
        - python3-cairo
        - python3-loguru
        - python3-click
        - python3-psutil
        - python3-tomlkit

  # Global install of Fabric into system Python (/usr)
  - type: script
    snippets:
      - pip install --no-deps --break-system-packages --prefix=/usr git+https://github.com/Fabric-Development/fabric.git

  # Initialize Noctalia Greeter state for Fedora's "greetd" session account.
  - type: script
    snippets:
      - |
        if command -v noctalia-greeter-apply-appearance >/dev/null 2>&1; then
          GREETER_USER=greetd noctalia-greeter-apply-appearance --setup-system
        else
          echo "noctalia-greeter-apply-appearance not found, skipping greeter setup"
        fi

  # Use greetd (Noctalia Greeter) as the display manager. SDDM remains
  # installed, so `systemctl enable --now sddm` can bring it back as a fallback.
  - type: systemd
    system:
      enabled:
        - greetd
      disabled:
        - sddm

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
